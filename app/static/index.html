<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Platform PoC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Agent Platform PoC</h1>
        <p>
          같은 서버의 <code>/v1/chat</code> · <code>/v1/hitl</code> ·
          <code>/v1/feedback</code> · <code>/v1/eval/report</code>를 호출하는
          얇은 데모 UI입니다. HITL은 tenant <code>demo</code>에서 확인하세요.
        </p>
      </header>

      <section class="panel" aria-label="chat form">
        <div class="row">
          <div>
            <label for="tenant">tenant_id</label>
            <input id="tenant" value="demo" autocomplete="off" />
          </div>
          <div>
            <label for="engine">engine (비우면 tenant 기본)</label>
            <select id="engine">
              <option value="multi_agent" selected>multi_agent</option>
              <option value="echo">echo</option>
              <option value="hybrid_rag">hybrid_rag</option>
              <option value="tool_router">tool_router</option>
              <option value="">(tenant default)</option>
            </select>
          </div>
        </div>
        <label for="query">query</label>
        <textarea id="query">
웹 뉴스와 samples/mini.csv 매출을 함께 요약해 줘.</textarea
        >
        <div class="actions">
          <button type="button" id="send">Send chat</button>
        </div>
      </section>

      <section id="result" class="panel hidden" aria-live="polite">
        <div class="meta">
          <span id="badge" class="badge idle">idle</span>
          <span id="meta"></span>
        </div>
        <div id="error-box" class="error-box"></div>
        <div id="last-feedback" class="last-feedback hidden"></div>
        <div id="preview" class="preview"></div>
        <div id="answer" class="answer"></div>
        <ul id="citations" class="citations"></ul>

        <div id="hitl-panel" class="hidden">
          <div class="actions">
            <button type="button" id="approve">Approve</button>
            <button type="button" id="revise" class="secondary">Revise…</button>
            <button type="button" id="reject" class="danger">Reject</button>
          </div>
          <div id="revise-extra" class="hitl-extra">
            <label for="feedback">feedback (revise 필수)</label>
            <textarea id="feedback" placeholder="무엇을 다시 볼까요?"></textarea>
            <label for="revise-target">revise_target</label>
            <select id="revise-target">
              <option value="analyst" selected>analyst (data 다시)</option>
              <option value="">both (search+analyst)</option>
              <option value="search">search (web 다시)</option>
            </select>
            <div class="actions">
              <button type="button" id="confirm-revise">Send revise</button>
            </div>
          </div>
        </div>

        <div id="rating-panel" class="rating-panel hidden">
          <h2 class="panel-sub">Rate this run</h2>
          <p class="hint">POST /v1/feedback · rating 1~5 (completed run)</p>
          <div class="rating-row" role="group" aria-label="rating">
            <button type="button" class="rate-btn" data-rating="1">1</button>
            <button type="button" class="rate-btn" data-rating="2">2</button>
            <button type="button" class="rate-btn" data-rating="3">3</button>
            <button type="button" class="rate-btn" data-rating="4">4</button>
            <button type="button" class="rate-btn" data-rating="5">5</button>
          </div>
          <label for="rating-comment">comment (선택)</label>
          <textarea
            id="rating-comment"
            placeholder="한 줄 코멘트"
          ></textarea>
          <div class="actions">
            <button type="button" id="submit-rating">Submit rating</button>
          </div>
          <div id="rating-status" class="rating-status" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel" aria-label="eval report">
        <h2 class="panel-sub">Eval report</h2>
        <p class="hint">
          GET /v1/eval/report · 파일은
          <code>python scripts/run_eval.py</code>로 생성
        </p>
        <div class="actions">
          <button type="button" id="load-eval" class="secondary">
            Load eval report
          </button>
        </div>
        <div id="eval-summary" class="eval-summary"></div>
        <pre id="eval-markdown" class="eval-markdown hidden"></pre>
      </section>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
