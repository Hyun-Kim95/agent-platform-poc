services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: agent_poc
    ports:
      # High host port avoids local Postgres often bound to 5432/5433.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # OTLP in → Jaeger UI (Stretch S4). App: OTEL_EXPORTER=otlp
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  pgdata:
