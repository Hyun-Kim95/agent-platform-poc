services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: agent_poc
    ports:
      # High host port avoids local Postgres often bound to 5432/5433.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
